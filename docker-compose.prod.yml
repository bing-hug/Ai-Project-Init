# 生产/联调形态：Nginx 同源部署，前端静态资源 + /api 反代到后端
# 启动：docker compose -f docker-compose.prod.yml up -d --build
# 访问：http://localhost:8088
name: fullstack-mall

services:
  mysql:
    image: mysql:8.4
    container_name: fullstack-mall-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fullstack_dev_root_password}
      MYSQL_DATABASE: fullstack_mall
      MYSQL_USER: mall
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mall_dev_password}
      TZ: Asia/Shanghai
    ports:
      - "3308:3306"
    volumes:
      - fullstack-mall-mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-fullstack_dev_root_password}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: fullstack-mall-redis
    ports:
      - "6379:6379"
    volumes:
      - fullstack-mall-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ./backend
    container_name: fullstack-mall-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/fullstack_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: mall
      DB_PASSWORD: ${MYSQL_PASSWORD:-mall_dev_password}
      REDIS_HOST: redis
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
    container_name: fullstack-mall-frontend
    ports:
      - "8088:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  fullstack-mall-mysql-data:
  fullstack-mall-redis-data:
